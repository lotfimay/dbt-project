version: 2

sources:
  - name: jaffle_shop
    description: a clone of postgres application database
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: raw customers data
        columns:
          - name: id
            tests:
              - unique
              - not_null
      - name: orders
        description: raw order data
        columns:
          - name: id
            description: the primary key for customers data
            tests:
              - unique
              - not_null
        freshness: 
          error_after:
            count: 4
            period: day
          warn_after:
            count: 2
            period: day
        loaded_at_field: _etl_loaded_at
        
